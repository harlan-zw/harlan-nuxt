name: Nuxt DX size budget
description: Diff this build's size budget report against the base branch and report what moved, as a step summary and a pull request comment.

inputs:
  report-path:
    description: Report this build wrote, relative to working-directory. Enable `nuxtDx.report` to produce it.
    required: false
    default: .nuxt/dx/size-budget.json
  threshold-kb:
    description: Growth a single target may take, never cumulative, before the summary calls it out.
    required: false
    default: '10'
  artifact-name:
    # Kept in step with `SNAPSHOT_ARTIFACT_NAME`, so a report format bump starts a clean
    # artifact rather than pairing a new report with a baseline `compare` refuses to read.
    description: Artifact prefix for this app and environment. The source commit is appended automatically.
    required: false
    default: nuxt-dx-size-budget-v3
  base-branch:
    description: Branch holding earlier reports. Defaults to the pull request base, then the repository default branch.
    required: false
    default: ''
  working-directory:
    description: Directory the app was built in.
    required: false
    default: .
  comment:
    description: 'Post the summary as a pull request comment, replacing this action''s previous one. Needs `pull-requests: write`; skipped with a notice when the token cannot write.'
    required: false
    default: 'true'
  fail-on-breach:
    description: Fail the job when a target grew past the threshold. Off by default, so growth is reported rather than blocking.
    required: false
    default: 'false'
  github-token:
    description: 'Token used to list workflow runs, download the baseline artifact, and comment. Needs `actions: read`, plus `pull-requests: write` to comment.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Identify this report
      id: report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        source_sha=$(git rev-parse HEAD)
        report_dir=$(mktemp -d "$RUNNER_TEMP/nuxt-dx.XXXXXXXX")
        echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
        echo "artifact-name=$ARTIFACT_NAME--$source_sha" >> "$GITHUB_OUTPUT"
        echo "directory=$report_dir" >> "$GITHUB_OUTPUT"
        echo "report-file=$(basename "$REPORT_PATH")" >> "$GITHUB_OUTPUT"

    # `npx --no-install` exits 1 when the bin is absent, which is the code a breached budget
    # also uses. Resolving the bin here keeps a missing install from reading as growth, and
    # from passing the job green with an empty summary.
    - name: Find the size budget CLI
      id: cli
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        dir="$PWD"
        while [ "$dir" != "/" ]; do
          if [ -x "$dir/node_modules/.bin/nuxt-dx" ]; then
            echo "path=$dir/node_modules/.bin/nuxt-dx" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$(dirname "$dir")"
        done
        if command -v nuxt-dx > /dev/null 2>&1; then
          echo "path=$(command -v nuxt-dx)" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Reported by the verdict step, so this build still uploads its own report.
        echo "path=" >> "$GITHUB_OUTPUT"

    # Parse the current report independently before allowing a missing baseline.
    - name: Validate current report
      if: steps.cli.outputs.path != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLI: ${{ steps.cli.outputs.path }}
        HEAD_REPORT: ${{ inputs.report-path }}
        THRESHOLD_KB: ${{ inputs.threshold-kb }}
      run: '"$CLI" compare "$HEAD_REPORT" "$HEAD_REPORT" --threshold-kb "$THRESHOLD_KB" > /dev/null'

    - name: Find the baseline run
      id: baseline
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        BASE_BRANCH: ${{ inputs.base-branch || github.event.pull_request.base.ref || github.event.repository.default_branch }}
        HEAD_SHA: ${{ steps.report.outputs.sha }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { findBaseline } = require(`${process.env.ACTION_PATH}/baseline.cjs`)
          const baseline = await findBaseline({
            github, repo: context.repo, repositoryId: context.payload.repository.id,
            runId: context.runId, artifactName: process.env.ARTIFACT_NAME,
            baseBranch: process.env.BASE_BRANCH, headSha: process.env.HEAD_SHA,
          })
          if (baseline) {
            core.setOutput('run-id', baseline.runId)
            core.setOutput('artifact-name', baseline.name)
            core.notice(`Baseline source: ${baseline.sha}, run ${baseline.runId}.`)
          } else {
            core.notice('No compatible baseline exists. This report starts a new baseline.')
          }

    # A missing baseline is normal. A failed download is an infrastructure error.
    - name: Download the baseline report
      if: steps.baseline.outputs.run-id != ''
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: ${{ steps.baseline.outputs.artifact-name }}
        path: ${{ steps.report.outputs.directory }}/baseline
        run-id: ${{ steps.baseline.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    # The comparison always runs to completion and always publishes. Whether a breach is
    # allowed to fail the job is decided in the step after this one, so a breach still
    # leaves a summary, a comment, and a new baseline behind.
    - name: Compare against the baseline
      id: compare
      if: steps.cli.outputs.path != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLI: ${{ steps.cli.outputs.path }}
        BASE_REPORT: ${{ steps.report.outputs.directory }}/baseline/${{ steps.report.outputs.report-file }}
        HEAD_REPORT: ${{ inputs.report-path }}
        THRESHOLD_KB: ${{ inputs.threshold-kb }}
        SUMMARY_FILE: ${{ steps.report.outputs.directory }}/summary.md
      run: |
        set -uo pipefail
        # GitHub runs `shell: bash` with `-e`, which `set` above does not undo. Without
        # the `if`, a breach exits the step here and the named status below never runs,
        # so `fail-on-breach: false` could not hold.
        if "$CLI" compare "$BASE_REPORT" "$HEAD_REPORT" \
          --threshold-kb "$THRESHOLD_KB" --allow-missing-base > "$SUMMARY_FILE"; then
          code=0
        else
          code="$?"
        fi
        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        cat "$SUMMARY_FILE"
        # Named, so the verdict step never has to read an exit code as growth.
        case "$code" in
          0) status=ok ;;
          1) status=breach ;;
          *) status=broken ;;
        esac
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "summary-file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

    # One comment per app, replaced in place, so a ten-push pull request carries the
    # current numbers rather than ten stale copies of them.
    - name: Comment the summary on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && (steps.compare.outputs.status == 'ok' || steps.compare.outputs.status == 'breach') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: <!-- nuxt-dx-size-budget:${{ inputs.artifact-name }} -->
        SUMMARY_FILE: ${{ steps.compare.outputs.summary-file }}
      run: |
        set -uo pipefail
        body="$(printf '%s\n\n%s\n' "$MARKER" "$(cat "$SUMMARY_FILE")")"
        # `$ENV.MARKER` keeps the marker out of the jq program text, where its `<!-- -->`
        # and quotes would need escaping through two layers.
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq 'map(select(.body | startswith($ENV.MARKER))) | .[0].id // empty' 2>/dev/null || true)
        if [ -n "$existing" ]; then
          method=PATCH
          target="repos/$REPO/issues/comments/$existing"
        else
          method=POST
          target="repos/$REPO/issues/$PR/comments"
        fi
        if ! gh api -X "$method" "$target" -f body="$body" > /dev/null 2>&1; then
          # A fork pull request gets a read-only token, and not every caller grants
          # `pull-requests: write`. The summary is already published either way.
          echo "::notice::Could not comment on #$PR, so the size budget is in the step summary only. Grant \`pull-requests: write\` to comment."
        fi

    # Only valid reports become baselines. Reruns replace their own artifact.
    - name: Keep this report as the next baseline
      if: ${{ !cancelled() && (steps.compare.outputs.status == 'ok' || steps.compare.outputs.status == 'breach') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.report.outputs.artifact-name }}
        overwrite: true
        include-hidden-files: true
        path: ${{ inputs.working-directory }}/${{ inputs.report-path }}
        if-no-files-found: error
        retention-days: 30

    # Last, so a failure here never costs the summary, the comment, or the baseline.
    # A missing CLI and a broken comparison both mean nothing was measured. Neither is growth,
    # so both fail regardless of what this action was asked to do about growth.
    - name: Apply the verdict
      shell: bash
      env:
        CLI: ${{ steps.cli.outputs.path }}
        STATUS: ${{ steps.compare.outputs.status }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FAIL_ON_BREACH: ${{ inputs.fail-on-breach }}
      run: |
        set -uo pipefail
        if [ -z "$CLI" ]; then
          echo "::error::The nuxt-dx CLI is not installed in \"$WORKING_DIRECTORY\" or any directory above it. Add \`@harlan-zw/nuxt-dx\` to the app and install it before this step."
          exit 1
        fi
        if [ "$STATUS" = "broken" ]; then
          echo "::error::nuxt-dx compare could not compare the two reports. See the log above."
          exit 1
        fi
        if [ "$STATUS" = "breach" ] && [ "$FAIL_ON_BREACH" = "true" ]; then
          echo "::error::A target grew past the threshold. See the size budget summary."
          exit 1
        fi
        if [ "$STATUS" = "breach" ]; then
          echo "::warning::A target grew past the threshold. Reporting only, since \`fail-on-breach\` is off."
        fi
