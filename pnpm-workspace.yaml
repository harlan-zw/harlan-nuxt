# `@harlan-zw/nuxt-jev` depends on `@harlan-zw/jev` with a registry spec so the
# published tarball is installable; inside this workspace the local package
# satisfies it, including before the first registry publish.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260811.1'
  - miniflare@5.20260804.0-alpha
  - wrangler@4.120.1
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

packages:
  - packages/*
  - packages/nuxt-checkin/tests/fixtures/basic

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@arethetypeswrong/cli': ^0.18.5
  '@cloudflare/workers-types': ^5.20260811.1
  '@harlan-zw/jev': ^0.3.0
  '@nuxt/kit': ^4.6.4
  '@nuxt/module-builder': ^1.0.2
  '@nuxt/schema': ^4.6.4
  '@nuxt/test-utils': ^4.4.0
  '@sentry/cloudflare': ^10.70.0 || ^11.0.0
  '@sentry/nuxt': ^10.70.0 || ^11.0.0
  '@types/node': ^26.6.6
  '@vitest/coverage-v8': 5.1.1
  '@vue/test-utils': ^2.6.0
  '@vueuse/core': ^14.4.0
  citty: ^0.2.2
  comark: 0.9.2
  confbox: ^0.3.2
  consola: ^3.4.2
  defu: ^6.1.7
  drizzle-orm: 1.0.0-rc.6
  eslint: ^10.15.0
  eslint-plugin-harlanzw: ^0.23.0
  eslint-plugin-vue: ^10.12.1
  evlog: ^2.37.1
  h3: 2.0.8
  happy-dom: ^21.0.4
  jiti: ^2.7.0
  nitro: 3.0.260903-beta
  nitropack: ^2.13.6
  nuxt: ^4.6.4
  ohash: ^2.0.12
  pathe: ^2.0.3
  pino: ^10.4.0
  pkg-pr-new: 0.0.94
  playwright: ^1.65.1

  rangi: ^2.2.0
  rollup: ^4.68.8
  typescript: ^6.0.3
  unbuild: ^3.6.1
  unstorage: ^1.17.6
  vite: ^8.3.8
  vitest: ^5.1.1
  vue: ^3.5.46
  vue-router: ^5.5.1
  vue-tsc: ^3.3.14
  wrangler: ^4.120.1
  yaml: ^2.9.1
  zod: ^4.6.7
ignoredBuiltDependencies:
  - esbuild

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    vue-sfc-transformer: '>=0.1.1 <0.3.0'
