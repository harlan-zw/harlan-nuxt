name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm lint
      - run: bash infra/github-runner/supervisor.test.sh
      - run: bash infra/github-runner/job-history.test.sh
      - run: bash infra/github-runner/backfill-job-history.test.sh
      - run: bash infra/github-runner/publish-status.test.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:attw
      - run: pnpm test:pack
